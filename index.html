<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فاکس‌کد | یادگیری برنامه‌نویسی</title>
<style>
:root{
  --bg:#12141a; --panel:#1b1e27; --panel2:#232733; --line:#2f3444;
  --text:#e8eaf0; --muted:#9aa1b5; --accent:#ff8a3d; --accent2:#ffb36b;
  --ok:#3ddc84; --bad:#ff5d6c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;line-height:1.8}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.logo{font-size:1.3rem;font-weight:700;color:var(--accent)}
.stats{display:flex;gap:10px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 14px;font-size:.95rem}
.layout{display:grid;grid-template-columns:270px 1fr;gap:16px;padding:16px;max-width:1200px;margin:0 auto}
aside{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;height:fit-content}
aside h3{margin:4px 8px 10px;font-size:1rem;color:var(--muted)}
.lesson-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:transparent;border:1px solid transparent;color:var(--text);padding:8px 10px;border-radius:10px;cursor:pointer;font:inherit}
.lesson-btn:hover{background:var(--panel2)}
.lesson-btn.active{background:var(--panel2);border-color:var(--accent)}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;background:var(--line);flex:none}
.lesson-btn.done .dot{background:var(--ok);color:#06210f}
.progress{height:8px;background:var(--line);border-radius:99px;margin:6px 8px 12px;overflow:hidden}
.progress div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .4s}
main{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
main h1{margin:0 0 6px;font-size:1.5rem}
.theory{color:#d3d7e4}
.theory code,.task code{background:#0d0f14;padding:1px 7px;border-radius:6px;direction:ltr;unicode-bidi:embed;color:var(--accent2)}
.task{background:var(--panel2);border-right:4px solid var(--accent);padding:10px 14px;border-radius:10px;margin:14px 0}
textarea{width:100%;min-height:210px;background:#0d0f14;color:#e6e6e6;border:1px solid var(--line);border-radius:12px;padding:12px;font-family:Consolas,"Courier New",monospace;font-size:15px;direction:ltr;text-align:left;resize:vertical;tab-size:2;line-height:1.6}
textarea:focus{outline:2px solid var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
button.btn{font:inherit;border:0;border-radius:10px;padding:8px 18px;cursor:pointer;background:var(--panel2);color:var(--text);border:1px solid var(--line)}
button.btn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#2a1300;font-weight:700;border-color:var(--accent)}
button.primary:hover{background:var(--accent2)}
.panel{background:#0d0f14;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:10px;direction:ltr;text-align:left;font-family:Consolas,monospace;font-size:14px;white-space:pre-wrap}
.test{padding:4px 0;border-bottom:1px dashed var(--line)}
.test:last-child{border:0}
.ok{color:var(--ok)} .bad{color:var(--bad)}
.msg{margin-top:10px;padding:10px 14px;border-radius:10px;font-weight:600}
.msg.good{background:rgba(61,220,132,.12);color:var(--ok);border:1px solid var(--ok)}
.msg.err{background:rgba(255,93,108,.1);color:var(--bad);border:1px solid var(--bad)}
.hidden{display:none}
.hintbox{margin-top:8px;color:var(--accent2)}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">🦊 فاکس‌کد</div>
  <div class="stats">
    <div class="chip" id="streak">🔥 0</div>
    <div class="chip" id="xp">⭐ 0</div>
  </div>
</header>

<div class="layout">
  <aside>
    <h3>درس‌های جاوااسکریپت</h3>
    <div class="progress"><div id="bar"></div></div>
    <div id="list"></div>
  </aside>

  <main>
    <h1 id="title"></h1>
    <div class="theory" id="theory"></div>
    <div class="task" id="task"></div>
    <textarea id="code" spellcheck="false" aria-label="ادیتور کد"></textarea>
    <div class="row">
      <button class="btn primary" id="run">▶ اجرا و بررسی (Ctrl+Enter)</button>
      <button class="btn" id="reset">بازنشانی کد</button>
      <button class="btn" id="hintBtn">💡 راهنمایی</button>
      <button class="btn" id="solBtn">دیدن پاسخ</button>
      <button class="btn hidden" id="next">درس بعدی ←</button>
    </div>
    <div class="hintbox hidden" id="hint"></div>
    <div id="result"></div>
  </main>
</div>

<script>
/* ---------- درس‌ها ---------- */
const LESSONS = [
  {
    title:"سلام دنیا",
    theory:"در برنامه‌نویسی، یک <b>تابع</b> کدی است که کاری انجام می‌دهد و می‌تواند یک مقدار را با <code>return</code> برگرداند. متن‌ها را بین کوتیشن می‌نویسیم، مثل <code>\"Hello\"</code>.",
    task:"تابع <code>solve</code> را طوری بنویس که متن <code>Hello, World!</code> را برگرداند.",
    starter:"function solve() {\n  // اینجا بنویس\n  \n}",
    hint:"از return و بعد متن داخل کوتیشن استفاده کن.",
    solution:"function solve() {\n  return \"Hello, World!\";\n}",
    tests:[{args:[],expected:"Hello, World!"}]
  },
  {
    title:"جمع دو عدد",
    theory:"تابع می‌تواند <b>ورودی</b> بگیرد. ورودی‌ها داخل پرانتز نوشته می‌شوند، مثل <code>function solve(a, b)</code>. با عملگر <code>+</code> دو عدد را جمع می‌کنیم.",
    task:"تابع <code>solve(a, b)</code> مجموع دو عدد را برگرداند.",
    starter:"function solve(a, b) {\n  \n}",
    hint:"return a + b;",
    solution:"function solve(a, b) {\n  return a + b;\n}",
    tests:[{args:[2,3],expected:5},{args:[10,-4],expected:6},{args:[0,0],expected:0}]
  },
  {
    title:"زوج یا فرد",
    theory:"با <code>if / else</code> می‌توانیم تصمیم بگیریم. عملگر <code>%</code> باقی‌مانده تقسیم را می‌دهد؛ مثلاً <code>7 % 2</code> برابر ۱ است. اگر باقی‌مانده تقسیم بر ۲ صفر باشد، عدد زوج است.",
    task:"تابع <code>solve(n)</code> اگر n زوج بود متن <code>even</code> و اگر فرد بود متن <code>odd</code> را برگرداند.",
    starter:"function solve(n) {\n  \n}",
    hint:"if (n % 2 === 0) { return \"even\"; }",
    solution:"function solve(n) {\n  if (n % 2 === 0) {\n    return \"even\";\n  }\n  return \"odd\";\n}",
    tests:[{args:[4],expected:"even"},{args:[7],expected:"odd"},{args:[0],expected:"even"}]
  },
  {
    title:"حلقه: جمع ۱ تا n",
    theory:"<b>حلقه</b> یک کار را چند بار تکرار می‌کند: <code>for (let i = 1; i &lt;= n; i++) { ... }</code>. می‌توانی یک متغیر مثل <code>sum</code> بسازی و در هر دور چیزی به آن اضافه کنی.",
    task:"تابع <code>solve(n)</code> مجموع عددهای ۱ تا n را برگرداند. مثلاً برای ۵ می‌شود ۱۵.",
    starter:"function solve(n) {\n  let sum = 0;\n  \n  return sum;\n}",
    hint:"داخل حلقه بنویس: sum += i;",
    solution:"function solve(n) {\n  let sum = 0;\n  for (let i = 1; i <= n; i++) {\n    sum += i;\n  }\n  return sum;\n}",
    tests:[{args:[1],expected:1},{args:[5],expected:15},{args:[100],expected:5050}]
  },
  {
    title:"آرایه: بزرگ‌ترین عدد",
    theory:"<b>آرایه</b> فهرستی از مقدارهاست: <code>[3, 9, 2]</code>. با <code>arr.length</code> طولش و با <code>arr[0]</code> عضو اول را می‌گیریم. می‌توانی روی آرایه حلقه بزنی.",
    task:"تابع <code>solve(arr)</code> بزرگ‌ترین عدد آرایه را برگرداند (آرایه حداقل یک عضو دارد).",
    starter:"function solve(arr) {\n  let max = arr[0];\n  \n  return max;\n}",
    hint:"روی همه عضوها حلقه بزن و اگر عضوی از max بزرگ‌تر بود، max را عوض کن.",
    solution:"function solve(arr) {\n  let max = arr[0];\n  for (let i = 1; i < arr.length; i++) {\n    if (arr[i] > max) {\n      max = arr[i];\n    }\n  }\n  return max;\n}",
    tests:[{args:[[3,9,2]],expected:9},{args:[[-5,-1,-8]],expected:-1},{args:[[7]],expected:7}]
  },
  {
    title:"معکوس کردن متن",
    theory:"متن هم مثل آرایه است: <code>s.length</code> و <code>s[0]</code> کار می‌کنند. با <code>+=</code> می‌توان حرف‌ها را به یک متن جدید چسباند.",
    task:"تابع <code>solve(s)</code> متن را برعکس برگرداند. مثلاً <code>abc</code> بشود <code>cba</code>.",
    starter:"function solve(s) {\n  let result = \"\";\n  \n  return result;\n}",
    hint:"حلقه را از آخر متن (s.length - 1) تا ۰ به عقب بزن.",
    solution:"function solve(s) {\n  let result = \"\";\n  for (let i = s.length - 1; i >= 0; i--) {\n    result += s[i];\n  }\n  return result;\n}",
    tests:[{args:["abc"],expected:"cba"},{args:["fox"],expected:"xof"},{args:[""],expected:""}]
  },
  {
    title:"فیلتر کردن آرایه",
    theory:"هر آرایه متدی به نام <code>filter</code> دارد: <code>arr.filter(x =&gt; x &gt; 2)</code> فقط عضوهایی را نگه می‌دارد که شرط برایشان درست است.",
    task:"تابع <code>solve(arr)</code> فقط عددهای زوج آرایه را (به همان ترتیب) برگرداند.",
    starter:"function solve(arr) {\n  \n}",
    hint:"return arr.filter(x => x % 2 === 0);",
    solution:"function solve(arr) {\n  return arr.filter(x => x % 2 === 0);\n}",
    tests:[{args:[[1,2,3,4,5,6]],expected:[2,4,6]},{args:[[1,3]],expected:[]},{args:[[8]],expected:[8]}]
  },
  {
    title:"شمارش حروف صدادار",
    theory:"می‌توانی بررسی کنی یک حرف داخل یک متن هست یا نه: <code>\"aeiou\".includes(ch)</code>. با <code>toLowerCase()</code> حرف‌ها را کوچک می‌کنیم تا بزرگ و کوچک فرقی نکند.",
    task:"تابع <code>solve(s)</code> تعداد حروف صدادار انگلیسی (a, e, i, o, u) در متن را برگرداند.",
    starter:"function solve(s) {\n  let count = 0;\n  \n  return count;\n}",
    hint:"روی حرف‌های s حلقه بزن؛ اگر \"aeiou\".includes(ch.toLowerCase()) درست بود، count را یکی زیاد کن.",
    solution:"function solve(s) {\n  let count = 0;\n  for (const ch of s) {\n    if (\"aeiou\".includes(ch.toLowerCase())) {\n      count++;\n    }\n  }\n  return count;\n}",
    tests:[{args:["hello"],expected:2},{args:["sky"],expected:0},{args:["Education"],expected:5}]
  }
];

/* ---------- ذخیره‌سازی ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("fc_"+k); return v===null? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("fc_"+k, JSON.stringify(v)); }catch(e){} }
};
let done = store.get("done", []);
let xp = store.get("xp", 0);
let streak = store.get("streak", 0);
let lastDay = store.get("last", "");
let cur = Math.min(store.get("cur", 0), LESSONS.length-1);

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const show = v => { try{ return v===undefined ? "undefined" : JSON.stringify(v); }catch(e){ return String(v); } };

/* ---------- نمایش ---------- */
function renderStats(){
  $("streak").textContent = "🔥 " + streak + " روز";
  $("xp").textContent = "⭐ " + xp + " امتیاز";
  $("bar").style.width = (done.length / LESSONS.length * 100) + "%";
}
function renderList(){
  $("list").innerHTML = "";
  LESSONS.forEach((l, i) => {
    const b = document.createElement("button");
    b.className = "lesson-btn" + (i===cur?" active":"") + (done.includes(i)?" done":"");
    b.innerHTML = '<span class="dot">' + (done.includes(i) ? "✓" : (i+1)) + '</span><span>' + esc(l.title) + '</span>';
    b.onclick = () => openLesson(i);
    $("list").appendChild(b);
  });
}
function openLesson(i){
  cur = i; store.set("cur", i);
  const l = LESSONS[i];
  $("title").textContent = (i+1) + ". " + l.title;
  $("theory").innerHTML = l.theory;
  $("task").innerHTML = "🎯 " + l.task;
  $("code").value = store.get("code"+i, l.starter);
  $("result").innerHTML = "";
  $("hint").classList.add("hidden");
  $("next").classList.toggle("hidden", !(done.includes(i) && i < LESSONS.length-1));
  renderList();
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ---------- اجرای امن کد داخل Worker ---------- */
const workerSrc = `
self.onmessage = function(e){
  const code = e.data.code, tests = e.data.tests, logs = [];
  const fakeConsole = { log: function(){ logs.push(Array.prototype.slice.call(arguments).map(function(x){ return typeof x === "string" ? x : JSON.stringify(x); }).join(" ")); } };
  try{
    const fn = new Function("console", code + "\\n;return typeof solve === 'function' ? solve : undefined;")(fakeConsole);
    if(!fn){ self.postMessage({error:"تابعی به نام solve پیدا نشد. اسم تابع را تغییر نده.", logs:logs}); return; }
    const results = [];
    for(const t of tests){
      try{
        const out = fn.apply(null, JSON.parse(JSON.stringify(t.args)));
        results.push({ok: JSON.stringify(out) === JSON.stringify(t.expected), got: out});
      }catch(err){ results.push({ok:false, err:String(err)}); }
    }
    self.postMessage({results:results, logs:logs});
  }catch(err){ self.postMessage({error:String(err), logs:logs}); }
};`;

function runCode(code, tests){
  return new Promise(resolve => {
    const url = URL.createObjectURL(new Blob([workerSrc], {type:"application/javascript"}));
    const w = new Worker(url);
    const timer = setTimeout(() => { w.terminate(); URL.revokeObjectURL(url); resolve({error:"کد بیش از ۳ ثانیه طول کشید. شاید حلقه بی‌پایان داری!"}); }, 3000);
    w.onmessage = e => { clearTimeout(timer); w.terminate(); URL.revokeObjectURL(url); resolve(e.data); };
    w.onerror = e => { clearTimeout(timer); w.terminate(); URL.revokeObjectURL(url); resolve({error:String(e.message||"خطا")}); };
    w.postMessage({code, tests});
  });
}

function updateStreak(){
  const today = new Date().toDateString();
  if(lastDay === today) return;
  const y = new Date(Date.now() - 86400000).toDateString();
  streak = (lastDay === y) ? streak + 1 : 1;
  lastDay = today;
  store.set("streak", streak); store.set("last", lastDay);
}

async function check(){
  const l = LESSONS[cur];
  const code = $("code").value;
  store.set("code"+cur, code);
  $("result").innerHTML = '<div class="panel">در حال اجرا...</div>';
  const r = await runCode(code, l.tests);
  let html = "";
  if(r.error){
    html = '<div class="msg err">⚠ ' + esc(r.error) + '</div>';
  } else {
    const lines = r.results.map((x, i) => {
      const t = l.tests[i];
      const inp = t.args.map(show).join(", ");
      if(x.ok) return '<div class="test ok">✓ تست ' + (i+1) + ' — solve(' + esc(inp) + ') = ' + esc(show(t.expected)) + '</div>';
      const got = x.err ? "خطا: " + x.err : show(x.got);
      return '<div class="test bad">✗ تست ' + (i+1) + ' — solve(' + esc(inp) + ')<br>مورد انتظار: ' + esc(show(t.expected)) + '<br>خروجی تو: ' + esc(got) + '</div>';
    }).join("");
    html = '<div class="panel">' + lines + '</div>';
    const all = r.results.every(x => x.ok);
    if(all){
      const first = !done.includes(cur);
      if(first){ done.push(cur); xp += 10; store.set("done", done); store.set("xp", xp); updateStreak(); }
      html += '<div class="msg good">🎉 آفرین! همه تست‌ها درست بود' + (first ? " (+۱۰ امتیاز)" : "") + '</div>';
      $("next").classList.toggle("hidden", cur >= LESSONS.length-1);
      renderStats(); renderList();
      if(cur === LESSONS.length-1) html += '<div class="msg good">🏆 همه درس‌ها را تمام کردی!</div>';
    } else {
      html += '<div class="msg err">یک یا چند تست درست نبود. دوباره امتحان کن، می‌توانی از راهنمایی هم استفاده کنی.</div>';
    }
  }
  if(r.logs && r.logs.length) html += '<div class="panel">console.log:\n' + esc(r.logs.join("\n")) + '</div>';
  $("result").innerHTML = html;
}

/* ---------- رویدادها ---------- */
$("run").onclick = check;
$("reset").onclick = () => { $("code").value = LESSONS[cur].starter; store.set("code"+cur, LESSONS[cur].starter); };
$("hintBtn").onclick = () => { $("hint").textContent = "💡 " + LESSONS[cur].hint; $("hint").classList.remove("hidden"); };
$("solBtn").onclick = () => { if(confirm("مطمئنی؟ بهتر است اول خودت تلاش کنی.")) { $("code").value = LESSONS[cur].solution; } };
$("next").onclick = () => openLesson(cur+1);
$("code").addEventListener("input", () => store.set("code"+cur, $("code").value));
$("code").addEventListener("keydown", e => {
  if(e.key === "Tab"){
    e.preventDefault();
    const t = e.target, s = t.selectionStart;
    t.value = t.value.slice(0, s) + "  " + t.value.slice(t.selectionEnd);
    t.selectionStart = t.selectionEnd = s + 2;
  } else if(e.key === "Enter" && (e.ctrlKey || e.metaKey)){
    e.preventDefault(); check();
  }
});

/* اگر دیروز را از دست داده باشد، استریک صفر نمایش داده شود */
(function(){
  const today = new Date().toDateString();
  const y = new Date(Date.now() - 86400000).toDateString();
  if(lastDay && lastDay !== today && lastDay !== y){ streak = 0; store.set("streak", 0); }
})();
renderStats();
openLesson(cur);
</script>
</body>
</html>
